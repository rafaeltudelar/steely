name: Site (GitHub Pages)

# Publica a pasta site/ junto com as telas de protótipo.
# Só roda quando alguém dispara à mão ou, depois de ativado, a cada push na main.
# Para ativar o automático: Settings → Pages → Source: GitHub Actions, e crie a
# variável de repositório PAGES_ATIVO = true (Settings → Secrets and variables → Actions → Variables).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "docs/05-design/prototipos/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ATIVO == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir -p _site/prototipos
          cp -r site/. _site/
          cp -r docs/05-design/prototipos/html _site/prototipos/html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
